name: Release

# Rodado à mão: aba "Actions" → "Release" → "Run workflow".
# A versão vem do Cargo.toml. Antes de um lançamento normal, aumente a versão,
# rode `cargo build` (atualiza o Cargo.lock) e faça commit dos dois arquivos.
on:
  workflow_dispatch:
    inputs:
      tipo:
        description: Tipo de lançamento
        type: choice
        options:
          - pre-release
          - release
        default: pre-release

permissions:
  contents: read

# Nunca dois lançamentos ao mesmo tempo (a checagem de versão depende disso).
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preparar:
    name: Versão e checagens
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versao.outputs.version }}
      tag: ${{ steps.versao.outputs.tag }}
      title: ${{ steps.versao.outputs.title }}
    steps:
      - name: Baixar o código (com as tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # traz todas as tags, para a checagem de versão
          persist-credentials: false

      - name: Ler a versão do Cargo.toml
        id: versao
        env:
          TIPO: ${{ inputs.tipo }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ "$TIPO" = "release" ]; then
            tag="v${version}"
            title="Rusted Serial ${version}"
          else
            # Pré-lançamentos não checam a versão: cada execução ganha uma tag única.
            tag="v${version}-pre.${RUN_NUMBER}"
            title="Rusted Serial ${version} (pré-lançamento ${RUN_NUMBER})"
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "title=${title}"
          } >> "$GITHUB_OUTPUT"
          echo "### ${TIPO}: \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Verificar se a versão já foi lançada
        if: inputs.tipo == 'release'
        env:
          TAG: ${{ steps.versao.outputs.tag }}
        run: |
          if git rev-parse --quiet --verify "refs/tags/${TAG}" > /dev/null; then
            echo "::error title=Versão já lançada::A tag ${TAG} já existe. Aumente a versão no Cargo.toml, rode 'cargo build' (atualiza o Cargo.lock) e faça commit antes de lançar."
            exit 1
          fi
          echo "A versão ${TAG} ainda não foi lançada."

  build-linux:
    name: Linux (AppImage, .deb, .rpm, .tar.gz)
    needs: preparar
    runs-on: ubuntu-latest
    # Compila numa glibc antiga (2.35) para o binário rodar em mais distribuições:
    # Ubuntu 22.04+, Debian 12+, Fedora, Arch, openSUSE…
    container: ubuntu:22.04
    env:
      VERSION: ${{ needs.preparar.outputs.version }}
      # Ferramentas do AppImage em versões fixas, conferidas por SHA-256 (o Dependabot
      # não atualiza estas: troque versão e hash juntos, à mão).
      APPIMAGETOOL_VERSION: "1.9.1"
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
      APPIMAGE_RUNTIME_VERSION: "20251108"
      APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
    steps:
      - name: Ferramentas de compilação
        # file: exigido pelo appimagetool (o resto que ele usa já vem embutido nele)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libudev-dev curl ca-certificates git file

      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Rust (stable)
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # branch stable
        with:
          toolchain: stable

      - name: Cache do Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Instalar cargo-deb
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deb@3.8.0

      - name: Instalar cargo-generate-rpm
        run: cargo install cargo-generate-rpm --version 0.21.1 --locked

      - name: Baixar appimagetool e runtime do AppImage
        run: |
          base=https://github.com/AppImage
          curl -fsSL -o appimagetool "${base}/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          curl -fsSL -o runtime-x86_64 "${base}/type2-runtime/releases/download/${APPIMAGE_RUNTIME_VERSION}/runtime-x86_64"
          # Falha se os arquivos não forem exatamente os conferidos.
          printf '%s  %s\n' \
            "$APPIMAGETOOL_SHA256" appimagetool \
            "$APPIMAGE_RUNTIME_SHA256" runtime-x86_64 | sha256sum -c -
          chmod +x appimagetool

      - name: Testes
        run: cargo test --locked

      - name: Build de release
        run: cargo build --locked --release

      - name: Empacotar
        run: |
          mkdir -p dist
          # .tar.gz portátil (qualquer distribuição)
          name="rusted-serial-${VERSION}-linux-x86_64"
          mkdir -p "pkg/${name}"
          cp target/release/rusted-serial README.md LICENSE assets/rusted-serial.desktop "pkg/${name}/"
          cp assets/icon.png "pkg/${name}/rusted-serial.png"
          tar -C pkg -czf "dist/${name}.tar.gz" "${name}"
          # .deb e .rpm, com atalho no menu e ícone
          cargo deb --no-build --output dist/
          cargo generate-rpm --output dist/
          # AppImage portátil: um arquivo só, roda sem instalar
          appdir=AppDir
          install -Dm755 target/release/rusted-serial "${appdir}/usr/bin/rusted-serial"
          install -Dm644 assets/rusted-serial.desktop "${appdir}/usr/share/applications/rusted-serial.desktop"
          install -Dm644 assets/icon.png "${appdir}/usr/share/icons/hicolor/512x512/apps/rusted-serial.png"
          install -Dm644 assets/icon.svg "${appdir}/usr/share/icons/hicolor/scalable/apps/rusted-serial.svg"
          cp assets/rusted-serial.desktop "${appdir}/"
          cp assets/icon.png "${appdir}/rusted-serial.png"
          ln -s rusted-serial.png "${appdir}/.DirIcon"
          ln -s usr/bin/rusted-serial "${appdir}/AppRun"
          # Contêineres não têm FUSE: o appimagetool roda extraído.
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool --runtime-file runtime-x86_64 \
            "${appdir}" "dist/rusted-serial-${VERSION}-x86_64.AppImage"
          ls -l dist

      - name: Guardar os pacotes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pacotes-linux
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: Windows (.exe portátil)
    needs: preparar
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.preparar.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Rust (stable)
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # branch stable
        with:
          toolchain: stable

      - name: Cache do Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Testes
        run: cargo test --locked

      - name: Build de release
        run: cargo build --locked --release

      - name: Empacotar
        run: |
          mkdir -p dist
          cp target/release/rusted-serial.exe "dist/rusted-serial-${VERSION}-windows-x86_64.exe"
          ls -l dist

      - name: Guardar o executável
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pacotes-windows
          path: dist/*
          if-no-files-found: error

  publicar:
    name: Publicar no GitHub Releases
    needs: [preparar, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # criar a tag e o lançamento
    steps:
      - name: Juntar os pacotes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pacotes-*
          path: dist
          merge-multiple: true

      - name: Gerar SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Criar o lançamento
        env:
          GH_TOKEN: ${{ github.token }}
          TIPO: ${{ inputs.tipo }}
          TAG: ${{ needs.preparar.outputs.tag }}
          TITLE: ${{ needs.preparar.outputs.title }}
        run: |
          flags=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --generate-notes)
          if [ "$TIPO" = "pre-release" ]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          gh release create "$TAG" dist/* "${flags[@]}"
          echo "Lançamento publicado: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
