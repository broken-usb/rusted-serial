name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # permite rodar manualmente pela aba "Actions"

permissions:
  contents: read

# Um push novo na mesma branch cancela a execução anterior que ainda estiver rodando.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# As actions são fixadas pelo hash do commit (e não por tag/branch, que podem ser
# movidas); o Dependabot (.github/dependabot.yml) abre PRs para atualizá-las.
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # se um sistema falhar, o outro continua (para ver os dois erros)
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            bin: rusted-serial
          - name: Windows
            os: windows-latest
            bin: rusted-serial.exe

    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        # libudev: listagem de portas do crate serialport (no Fedora: systemd-devel)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev pkg-config

      - name: Instalar Rust (stable)
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # branch stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache do Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Formatação (cargo fmt)
        if: runner.os == 'Linux' # o resultado é igual nos dois sistemas
        run: cargo fmt --all --check

      - name: Lint (cargo clippy)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Testes
        run: cargo test --locked

      - name: Build de release
        run: cargo build --locked --release

      - name: Publicar o executável
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rusted-serial-${{ runner.os }}
          path: target/release/${{ matrix.bin }}
          retention-days: 14

  audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar cargo-audit
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit

      # Procura vulnerabilidades conhecidas (RustSec) nas versões do Cargo.lock.
      - name: cargo audit
        run: cargo audit
